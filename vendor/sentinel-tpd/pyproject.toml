[project]
name = "sentinel-tpd"
version = "2026.8.0"
description = "Content-level trust gate for MCP tool metadata: scan at TOOL_REGISTERED, deny on mutation at call time."
authors = [{ name = "Rajeshkumar Sampathrajan" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_tpd*"]
